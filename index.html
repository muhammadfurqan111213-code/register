<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Intern Registration Form</title>
</head>
<body>
    <center>
     <h1>Intern Registration Form</h1>

    <fieldset style="width: fit-content;">
    <legend>Intern Registration Form</legend>
    <form action="" method="get">
        <label for="name">Full Name:</label><br>
        <input
            type="text"
            placeholder="Enter your full name"
            >
        <br><br>
        <label for="email">Email:</label><br>
        <input
            type="email"
            placeholder="example@email.com">
        <br><br>
        <label for="phone">Phone:</label><br>
        <input
            type="tel"
            placeholder="Enter your phone number">
        <br><br>
        <label for="dob">Date of Birth:</label><br>
        <input
            type="date">
        <br><br>
        <label>Gender:</label><br>
        <input type="radio" >
        <label for="male">Male</label>
        <input type="radio" >
        <label for="female">Female</label>
        <input type="radio" >
        <label for="other">Other</label>
        <br><br>
        <label for="course">Course:</label><br>
        <select >
            <option value="">Select a Course</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="software-engineering">Software Engineering</option>
            <option value="business-administration">Business Administration</option>
            <option value="engineering">Engineering</option>
        </select>
        <br><br>
        <label>Skills</label><br>
        <input type="checkbox" >
        <label for="html">HTML</label>
        <input type="checkbox">
        <label for="css">CSS</label>
        <input type="checkbox" >
        <label for="javascript">JavaScript</label>
        <input type="checkbox" >
        <label for="python">Python</label>
        <br><br>
        <label for="address">Address:</label><br>
        <textarea rows="4" cols="40"  placeholder="Enter your complete address"></textarea>
        <br><br>
        <label for="message">Message:</label><br>
        <textarea rows="5" cols="40" placeholder="Write a message or introduce yourself"></textarea>
        </fieldset>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    
 </center>
</body>
</html>
